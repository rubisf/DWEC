<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Reto 4: Pipeline MongoDB</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 font-sans">
  <div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-lg font-bold text-sky-400">🎯 Reto 4: Pipeline de Agregación NoSQL MongoDB ($match, $group, $sort)</h2>
    <div class="p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono text-sky-300 space-y-1">
      <div>db.ventas.aggregate([</div>
      <div class="pl-4">{ $match: { status: "completed" } },</div>
      <div class="pl-4">{ $group: { _id: "$categoria", total: { $sum: "$monto" } } },</div>
      <div class="pl-4">{ $sort: { total: -1 } }</div>
      <div>]);</div>
    </div>
  </div>
</body>
</html>
