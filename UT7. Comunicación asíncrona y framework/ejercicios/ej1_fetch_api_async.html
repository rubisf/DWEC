<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fetch API con Async/Await</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6 text-slate-800">
  <div class="max-w-3xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
    <div class="flex justify-between items-center mb-4">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Directorio Asíncrono con Fetch API</h1>
        <p class="text-xs text-slate-500">Consulta en vivo a API REST pública con control de errores y spinner de carga.</p>
      </div>
      <button onclick="cargar()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-bold transition">
        🔄 Consultar API
      </button>
    </div>

    <div id="loading" class="text-center py-8 text-xs font-bold text-rose-600 hidden">
      ⏳ Cargando datos asíncronos vía Fetch...
    </div>

    <div id="gridUsuarios" class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs"></div>
  </div>

  <script>
    async function cargar() {
      const loader = document.getElementById('loading');
      const grid = document.getElementById('gridUsuarios');
      loader.classList.remove('hidden');
      grid.innerHTML = "";

      try {
        const res = await fetch("https://jsonplaceholder.typicode.com/users");
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        const usuarios = await res.json();
        
        grid.innerHTML = usuarios.slice(0, 6).map(u => `
          <div class="p-3 bg-slate-50 rounded-xl border border-slate-200">
            <h3 class="font-bold text-slate-800 text-sm">${u.name}</h3>
            <p class="text-slate-500">📧 ${u.email}</p>
            <p class="text-slate-400 mt-1">📍 ${u.address.city} (${u.company.name})</p>
          </div>
        `).join('');
      } catch (err) {
        grid.innerHTML = `<div class="col-span-2 p-3 bg-rose-50 text-rose-700 rounded-xl">Error: ${err.message}</div>`;
      } finally {
        loader.classList.add('hidden');
      }
    }
    cargar();
  </script>
</body>
</html>
