<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Reto 1: Fetch, async/await y AbortController</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 font-sans">
  <div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-lg font-bold text-indigo-400">🎯 Reto 1: Fetch API con async/await, response.ok y AbortController</h2>
    <div class="flex gap-2">
      <button onclick="consultarAPI()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-1.5 px-3 rounded text-xs">Consultar usuarios API</button>
      <button onclick="cancelarPeticion()" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-1.5 px-3 rounded text-xs">Cancelar con AbortController</button>
    </div>
    <div id="out-fetch" class="p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono space-y-1 text-emerald-300"></div>
  </div>
  <script>
    let controller = null;
    async function consultarAPI() {
      controller = new AbortController();
      const out = document.getElementById('out-fetch');
      out.textContent = "Cargando datos...";
      try {
        const res = await fetch('https://jsonplaceholder.typicode.com/users?_limit=3', { signal: controller.signal });
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        const data = await res.json();
        out.innerHTML = `✅ Datos recibidos (${data.length} usuarios):<br>` + data.map(u => `- ${u.name} (${u.email})`).join('<br>');
      } catch (e) {
        if (e.name === 'AbortError') out.textContent = "❌ Petición cancelada mediante AbortController.";
        else out.textContent = "❌ Error: " + e.message;
      }
    }

    function cancelarPeticion() {
      if (controller) controller.abort();
    }
  </script>
</body>
</html>
