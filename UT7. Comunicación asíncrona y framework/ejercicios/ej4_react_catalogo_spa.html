<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Práctica Guiada 4: Catálogo Interactivo SPA con React 18</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade { animation: fadeIn 0.25s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const PRODUCTOS_MOCK = [
      { id: 1, nombre: "Laptop Pro Dev 16\"", categoria: "Hardware", precio: 1499.99, rating: 4.9, stock: 8, imagen: "💻" },
      { id: 2, nombre: "Monitor Curvo 34\" 4K", categoria: "Monitores", precio: 549.50, rating: 4.8, stock: 12, imagen: "🖥️" },
      { id: 3, nombre: "Teclado Mecánico RGB HotSwap", categoria: "Periféricos", precio: 129.00, rating: 4.7, stock: 25, imagen: "⌨️" },
      { id: 4, nombre: "Ratón Ergonómico Inalámbrico", categoria: "Periféricos", precio: 79.99, rating: 4.6, stock: 18, imagen: "🖱️" },
      { id: 5, nombre: "Auriculares Hi-Fi Cancelación Ruido", categoria: "Audio", precio: 199.90, rating: 4.9, stock: 7, imagen: "🎧" },
      { id: 6, nombre: "Hub USB-C 10 en 1", categoria: "Accesorios", precio: 49.99, rating: 4.5, stock: 30, imagen: "🔌" }
    ];

    function App() {
      const [productos, setProductos] = useState([]);
      const [cargando, setCargando] = useState(true);
      const [busqueda, setBusqueda] = useState("");
      const [categoriaActiva, setCategoriaActiva] = useState("Todas");
      const [carritoAbierto, setCarritoAbierto] = useState(false);
      const [notificacion, setNotificacion] = useState(null);

      // Carrito persistido en localStorage
      const [carrito, setCarrito] = useState(() => {
        try {
          const guardado = localStorage.getItem("react_carrito_ut7");
          return guardado ? JSON.parse(guardado) : [];
        } catch {
          return [];
        }
      });

      // Guardar en localStorage ante cambios en el carrito
      useEffect(() => {
        localStorage.setItem("react_carrito_ut7", JSON.stringify(carrito));
      }, [carrito]);

      // Simular consumo de API REST externa con useEffect
      useEffect(() => {
        const timer = setTimeout(() => {
          setProductos(PRODUCTOS_MOCK);
          setCargando(false);
        }, 700);
        return () => clearTimeout(timer);
      }, []);

      const mostrarAviso = (msg) => {
        setNotificacion(msg);
        setTimeout(() => setNotificacion(null), 2500);
      };

      const agregarAlCarrito = (prod) => {
        setCarrito(prev => {
          const existe = prev.find(item => item.id === prod.id);
          if (existe) {
            return prev.map(item => item.id === prod.id ? { ...item, cantidad: item.cantidad + 1 } : item);
          }
          return [...prev, { ...prod, cantidad: 1 }];
        });
        mostrarAviso(`✅ "${prod.nombre}" añadido al carrito`);
      };

      const actualizarCantidad = (id, delta) => {
        setCarrito(prev => prev.map(item => {
          if (item.id === id) {
            const nueva = item.cantidad + delta;
            return nueva > 0 ? { ...item, cantidad: nueva } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const vaciarCarrito = () => {
        setCarrito([]);
        mostrarAviso("🗑️ Carrito vaciado correctamente");
      };

      // Categorías únicas
      const categorias = useMemo(() => {
        const cats = ["Todas", ...new Set(PRODUCTOS_MOCK.map(p => p.categoria))];
        return cats;
      }, []);

      // Productos filtrados reactivamente
      const productosFiltrados = useMemo(() => {
        return productos.filter(p => {
          const coincideCat = categoriaActiva === "Todas" || p.categoria === categoriaActiva;
          const coincideTexto = p.nombre.toLowerCase().includes(busqueda.toLowerCase());
          return coincideCat && coincideTexto;
        });
      }, [productos, categoriaActiva, busqueda]);

      const totalItemsCarrito = carrito.reduce((sum, item) => sum + item.cantidad, 0);
      const subtotalCarrito = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Notificación flotante */}
          {notificacion && (
            <div className="fixed top-4 right-4 z-50 bg-indigo-600 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-2xl animate-fade flex items-center gap-2">
              <span>{notificacion}</span>
            </div>
          )}

          {/* Header */}
          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <span className="text-2xl">⚛️</span>
              <div>
                <h1 className="text-base font-bold text-white flex items-center gap-2">
                  <span>TechStore SPA</span>
                  <span className="text-[10px] bg-sky-950 text-sky-400 border border-sky-800 px-2 py-0.5 rounded font-mono">React 18</span>
                </h1>
                <p className="text-[11px] text-slate-400">Desarrollo Web en Entorno Cliente · UT7</p>
              </div>
            </div>

            <button
              onClick={() => setCarritoAbierto(true)}
              className="relative bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2"
            >
              <span>🛒 Carrito</span>
              {totalItemsCarrito > 0 && (
                <span className="bg-indigo-600 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold">
                  {totalItemsCarrito}
                </span>
              )}
            </button>
          </header>

          {/* Contenido Principal */}
          <main className="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-6">
            {/* Controles de Búsqueda y Filtros */}
            <div className="bg-slate-900/70 border border-slate-800 p-4 rounded-2xl flex flex-col sm:flex-row gap-4 items-center justify-between shadow-lg">
              <div className="w-full sm:w-72">
                <input
                  type="text"
                  placeholder="🔍 Buscar productos..."
                  value={busqueda}
                  onChange={(e) => setBusqueda(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div className="flex flex-wrap gap-1.5 w-full sm:w-auto">
                {categorias.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setCategoriaActiva(cat)}
                    className={`text-xs px-3 py-1.5 rounded-lg font-semibold transition-all ${
                      categoriaActiva === cat
                        ? "bg-indigo-600 text-white shadow-sm"
                        : "bg-slate-800 text-slate-400 hover:bg-slate-700"
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>
            </div>

            {/* Grid de Productos */}
            {cargando ? (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                {[1, 2, 3, 4, 5, 6].map(n => (
                  <div key={n} className="bg-slate-900/50 border border-slate-800 rounded-2xl p-5 space-y-3 animate-pulse">
                    <div className="h-28 bg-slate-800/80 rounded-xl"></div>
                    <div className="h-4 bg-slate-800 rounded w-3/4"></div>
                    <div className="h-3 bg-slate-800 rounded w-1/2"></div>
                    <div className="h-8 bg-slate-800 rounded-xl"></div>
                  </div>
                ))}
              </div>
            ) : productosFiltrados.length === 0 ? (
              <div className="text-center py-16 bg-slate-900/30 border border-slate-800/60 rounded-2xl">
                <span className="text-4xl block mb-2">🔍</span>
                <p className="text-sm font-semibold text-slate-300">No hay productos que coincidan con la búsqueda.</p>
                <p className="text-xs text-slate-500 mt-1">Prueba seleccionando otra categoría o limpiando el texto.</p>
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                {productosFiltrados.map(prod => (
                  <div
                    key={prod.id}
                    className="bg-slate-900/80 border border-slate-800 hover:border-indigo-500/50 rounded-2xl p-5 flex flex-col justify-between transition-all hover:shadow-xl group"
                  >
                    <div>
                      <div className="h-28 bg-slate-950/60 border border-slate-800/80 rounded-xl flex items-center justify-center text-4xl mb-4 group-hover:scale-105 transition-transform">
                        {prod.imagen}
                      </div>
                      <div className="flex items-center justify-between text-[11px] text-indigo-400 font-semibold mb-1">
                        <span>{prod.categoria}</span>
                        <span className="text-amber-400">⭐ {prod.rating}</span>
                      </div>
                      <h3 className="text-sm font-bold text-white mb-2 leading-tight">{prod.nombre}</h3>
                    </div>

                    <div className="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between">
                      <div>
                        <span className="text-[10px] text-slate-400 block">Precio</span>
                        <span className="text-base font-black text-emerald-400">{prod.precio.toFixed(2)} €</span>
                      </div>
                      <button
                        onClick={() => agregarAlCarrito(prod)}
                        className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-3.5 py-2 rounded-xl transition-colors shadow-md flex items-center gap-1.5"
                      >
                        <span>+ Carrito</span>
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* Modal / Drawer del Carrito */}
          {carritoAbierto && (
            <div className="fixed inset-0 z-50 flex justify-end bg-slate-950/70 backdrop-blur-sm animate-fade">
              <div className="w-full max-w-md bg-slate-900 border-l border-slate-800 p-6 flex flex-col h-full shadow-2xl">
                <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                  <h2 className="text-base font-extrabold text-white flex items-center gap-2">
                    <span>🛒 Tu Carrito</span>
                    <span className="text-xs text-indigo-400">({totalItemsCarrito} items)</span>
                  </h2>
                  <button
                    onClick={() => setCarritoAbierto(false)}
                    className="text-slate-400 hover:text-white text-lg px-2"
                  >
                    ✕
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto py-4 space-y-3">
                  {carrito.length === 0 ? (
                    <div className="text-center py-12 text-slate-500 text-xs">
                      <span className="text-3xl block mb-2">🛍️</span>
                      El carrito está actualmente vacío.
                    </div>
                  ) : (
                    carrito.map(item => (
                      <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-between text-xs">
                        <div className="flex items-center gap-3">
                          <span className="text-xl">{item.imagen}</span>
                          <div>
                            <strong className="text-white block">{item.nombre}</strong>
                            <span className="text-emerald-400 font-mono font-bold">{item.precio.toFixed(2)} €</span>
                          </div>
                        </div>
                        <div className="flex items-center gap-2 bg-slate-900 border border-slate-700 px-2 py-1 rounded-lg">
                          <button onClick={() => actualizarCantidad(item.id, -1)} className="text-slate-400 hover:text-white font-bold">-</button>
                          <span className="text-white font-bold px-1">{item.cantidad}</span>
                          <button onClick={() => actualizarCantidad(item.id, 1)} className="text-slate-400 hover:text-white font-bold">+</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {carrito.length > 0 && (
                  <div className="border-t border-slate-800 pt-4 space-y-3">
                    <div className="flex items-center justify-between text-sm">
                      <span className="text-slate-400">Total a pagar:</span>
                      <strong className="text-emerald-400 text-lg">{subtotalCarrito.toFixed(2)} €</strong>
                    </div>
                    <div className="flex gap-2">
                      <button
                        onClick={vaciarCarrito}
                        className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs py-2.5 rounded-xl transition-colors"
                      >
                        Vaciar
                      </button>
                      <button
                        onClick={() => {
                          alert(`¡Pedido realizado con éxito por valor de ${subtotalCarrito.toFixed(2)} €!`);
                          vaciarCarrito();
                          setCarritoAbierto(false);
                        }}
                        className="flex-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-2.5 px-4 rounded-xl transition-colors shadow-lg"
                      >
                        Tramitar Pedido
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
