<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Reto 4: Contexto this con call, apply y bind</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 font-sans">
  <div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-lg font-bold text-sky-400">🎯 Reto 4: Vinculación de Contexto this (call, apply, bind)</h2>
    <div id="out-this" class="p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono space-y-2 text-sky-300"></div>
  </div>
  <script>
    function presentar(rol, ciudad) {
      return `Hola, soy ${this.nombre} (${rol}) de ${ciudad}.`;
    }
    const dev1 = { nombre: "Elena" };
    const dev2 = { nombre: "Marcos" };

    const resCall = presentar.call(dev1, "Senior Frontend", "Madrid");
    const resApply = presentar.apply(dev2, ["Backend Lead", "Barcelona"]);
    const fnBind = presentar.bind(dev1, "Arquitecta Web", "Valencia");

    const out = document.getElementById('out-this');
    out.innerHTML = `
      <div>1. call(): ${resCall}</div>
      <div>2. apply(): ${resApply}</div>
      <div>3. bind(): ${fnBind()}</div>
    `;
  </script>
</body>
</html>
