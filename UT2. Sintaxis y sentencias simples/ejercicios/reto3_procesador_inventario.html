<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Reto 3: Clonación Inmutable con Spread y Bucles Modernos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 font-sans">
  <div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-lg font-bold text-amber-400">🎯 Reto 3: Clonación Inmutable con Operador Spread (...) y Bucles for...of</h2>
    <div id="out-spread" class="p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono space-y-2"></div>
  </div>
  <script>
    const notasOriginales = [4.5, 7.0, 8.5, 3.2];
    // 1. Clonación inmutable con spread (...) y fusión de 2 nuevas notas
    const todasNotas = [...notasOriginales, 9.0, 6.5];

    // 2. Iteración limpia con bucle for...of
    let sumaAprobados = 0, countAprobados = 0;
    for (const nota of todasNotas) {
      if (nota >= 5.0) {
        sumaAprobados += nota;
        countAprobados++;
      }
    }

    const media = countAprobados > 0 ? (sumaAprobados / countAprobados).toFixed(2) : 0;

    const out = document.getElementById('out-spread');
    out.innerHTML = `
      <div class="text-slate-400">📊 Array Original (Inalterado): [${notasOriginales.join(', ')}]</div>
      <div class="text-amber-300">✨ Array Clonado con Spread (...): [${todasNotas.join(', ')}]</div>
      <div class="text-emerald-400 font-bold border-t border-slate-800 pt-2 mt-2">
        ✅ Media de los ${countAprobados} aprobados (calculada con for...of): ${media}
      </div>
    `;
  </script>
</body>
</html>
