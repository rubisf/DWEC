<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Reto 2: Mutabilidad const y Scope</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 font-sans">
  <div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-lg font-bold text-emerald-400">🎯 Reto 2: Mutabilidad const (.push) vs TypeError en Reasignación</h2>
    <div id="out-const" class="p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono space-y-2"></div>
  </div>
  <script>
    const out = document.getElementById('out-const');
    const alumnos = ['Carlos', 'Beatriz'];
    alumnos.push('David'); // Permitido
    out.innerHTML += `<div class="text-emerald-300">✅ Mutación con .push() en const: [${alumnos.join(', ')}]</div>`;

    try {
      alumnos = ['Nuevo Array']; // TypeError
    } catch (e) {
      out.innerHTML += `<div class="text-rose-400">❌ Error al reasignar const: ${e.message}</div>`;
    }

    // Comprobación let vs var en bucle
    let closuresLet = [];
    for (let i = 0; i < 2; i++) closuresLet.push(() => i);
    out.innerHTML += `<div class="text-amber-300">Bucle let (Block Scope): i = ${closuresLet[0]()} y ${closuresLet[1]()}</div>`;
  </script>
</body>
</html>
