<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CRUD con IndexedDB Transaccional</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6 text-slate-800">
  <div class="max-w-3xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
    <h1 class="text-xl font-bold text-slate-900 mb-2">Base de Datos Transaccional IndexedDB</h1>
    <p class="text-xs text-slate-500 mb-4">Almacén de objetos en el cliente para operaciones asíncronas de gran capacidad.</p>

    <div class="flex gap-2 mb-4">
      <input id="cNombre" type="text" placeholder="Nombre completo" class="border p-2 rounded-lg text-sm flex-1">
      <input id="cEmail" type="email" placeholder="correo@ejemplo.com" class="border p-2 rounded-lg text-sm flex-1">
      <button onclick="guardarCliente()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-xs">Añadir a IndexedDB</button>
    </div>

    <div class="border border-slate-200 rounded-xl overflow-hidden">
      <table class="w-full text-xs text-left">
        <thead class="bg-slate-100 text-slate-600 font-bold">
          <tr><th class="p-3">ID</th><th class="p-3">Nombre</th><th class="p-3">Email</th><th class="p-3 text-right">Acción</th></tr>
        </thead>
        <tbody id="tablaClientes" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </div>

  <script>
    let db;
    const req = indexedDB.open("DWEC_ClientesDB", 1);

    req.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("clientes")) {
        db.createObjectStore("clientes", { keyPath: "id", autoIncrement: true });
      }
    };

    req.onsuccess = (e) => {
      db = e.target.result;
      listarClientes();
    };

    function guardarCliente() {
      const nombre = document.getElementById('cNombre').value.trim();
      const email = document.getElementById('cEmail').value.trim();
      if (!nombre || !email) return;

      const tx = db.transaction(["clientes"], "readwrite");
      const store = tx.objectStore("clientes");
      store.add({ nombre, email, fecha: new Date() });
      tx.oncomplete = () => {
        document.getElementById('cNombre').value = "";
        document.getElementById('cEmail').value = "";
        listarClientes();
      };
    }

    function listarClientes() {
      const tx = db.transaction(["clientes"], "readonly");
      const store = tx.objectStore("clientes");
      const req = store.getAll();
      req.onsuccess = () => {
        const clientes = req.result;
        const tbody = document.getElementById('tablaClientes');
        tbody.innerHTML = clientes.map(c => `
          <tr class="hover:bg-slate-50">
            <td class="p-3 font-mono text-slate-400">#${c.id}</td>
            <td class="p-3 font-semibold text-slate-800">${c.nombre}</td>
            <td class="p-3 text-slate-600">${c.email}</td>
            <td class="p-3 text-right"><button onclick="eliminarCliente(${c.id})" class="text-rose-600 hover:underline">Eliminar</button></td>
          </tr>
        `).join('') || '<tr><td colspan="4" class="p-4 text-center text-slate-400 italic">No hay clientes almacenados</td></tr>';
      };
    }

    function eliminarCliente(id) {
      const tx = db.transaction(["clientes"], "readwrite");
      tx.objectStore("clientes").delete(id);
      tx.oncomplete = () => listarClientes();
    }
  </script>
</body>
</html>
