<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Validador con RegExp e Intl</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6 text-slate-800">
  <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
    <h1 class="text-xl font-bold text-slate-900 mb-2">Validador de Documentos y Salarios</h1>
    <p class="text-xs text-slate-500 mb-4">Uso de expresiones regulares para DNI y formateo monetario localizado con la API Intl.</p>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">DNI Español (8 dígitos + letra)</label>
        <input id="dniInput" oninput="validar()" type="text" placeholder="12345678Z" class="w-full border p-2 rounded-lg text-sm">
        <span id="dniMsg" class="text-xs mt-1 block font-semibold"></span>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Salario Anual Bruto (€)</label>
        <input id="salarioInput" oninput="validar()" type="number" value="32500" class="w-full border p-2 rounded-lg text-sm">
      </div>

      <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-1">
        <div class="flex justify-between"><span>Formato España (es-ES):</span><strong id="fmtEs">-</strong></div>
        <div class="flex justify-between"><span>Formato USA (en-US):</span><strong id="fmtUs">-</strong></div>
      </div>
    </div>
  </div>

  <script>
    function validar() {
      const dni = document.getElementById('dniInput').value.trim();
      const msg = document.getElementById('dniMsg');
      const regex = /^(\d{8})([A-Z])$/i;
      const match = dni.match(regex);

      if (!match) {
        msg.textContent = "Formato no válido (debe tener 8 números y una letra)";
        msg.className = "text-xs mt-1 block font-semibold text-amber-600";
      } else {
        const letras = "TRWAGMYFPDXBNJZSQVHLCKE";
        const esperada = letras[parseInt(match[1], 10) % 23];
        if (match[2].toUpperCase() === esperada) {
          msg.textContent = "✅ DNI Válido (Letra de control verificada con mod 23)";
          msg.className = "text-xs mt-1 block font-semibold text-emerald-600";
        } else {
          msg.textContent = `❌ Letra incorrecta. Para los dígitos ${match[1]} corresponde la '${esperada}'`;
          msg.className = "text-xs mt-1 block font-semibold text-rose-600";
        }
      }

      const salario = parseFloat(document.getElementById('salarioInput').value) || 0;
      document.getElementById('fmtEs').textContent = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }).format(salario);
      document.getElementById('fmtUs').textContent = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(salario);
    }
    validar();
  </script>
</body>
</html>
