<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Reto 2: Validación con RegExp</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 font-sans">
  <div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-lg font-bold text-emerald-400">🎯 Reto 2: Validación Estricta con RegExp.test()</h2>
    <div id="out-re" class="p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono space-y-2"></div>
  </div>
  <script>
    const reSegura = /^(?=.*[A-Z])(?=.*\d).{8,}$/;
    const pass1 = "Abc12345";
    const pass2 = "debil";

    const out = document.getElementById('out-re');
    out.innerHTML = `
      <div class="text-emerald-400">🔑 '${pass1}' -> reSegura.test(): <strong>${reSegura.test(pass1)}</strong> (Válida)</div>
      <div class="text-rose-400">🔑 '${pass2}' -> reSegura.test(): <strong>${reSegura.test(pass2)}</strong> (Inválida)</div>
    `;
  </script>
</body>
</html>
