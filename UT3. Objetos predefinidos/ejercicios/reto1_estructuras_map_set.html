<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Reto 1: Map y Set</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 font-sans">
  <div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-lg font-bold text-indigo-400">🎯 Reto 1: Recuento de Frecuencias (Map) y Únicos (Set)</h2>
    <div id="out-mapset" class="p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono space-y-2"></div>
  </div>
  <script>
    const nombres = ["Ana", "Carlos", "Ana", "Beatriz", "Carlos", "Ana"];

    // 1. Set para obtener elementos únicos
    const unicosSet = new Set(nombres);

    // 2. Map para contar frecuencias
    const frecuenciasMap = new Map();
    for (const n of nombres) {
      frecuenciasMap.set(n, (frecuenciasMap.get(n) || 0) + 1);
    }

    let frecText = [];
    frecuenciasMap.forEach((cant, nom) => frecText.push(`${nom}: ${cant}`));

    const out = document.getElementById('out-mapset');
    out.innerHTML = `
      <div class="text-emerald-300">Set de Únicos: [${Array.from(unicosSet).join(', ')}]</div>
      <div class="text-amber-300">Map de Frecuencias: { ${frecText.join(' | ')} }</div>
    `;
  </script>
</body>
</html>
