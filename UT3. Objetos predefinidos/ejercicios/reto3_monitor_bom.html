<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Reto 3: Jerarquía BOM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 font-sans">
  <div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-lg font-bold text-amber-400">🎯 Reto 3: Objetos BOM (navigator, location, history, screen)</h2>
    <div id="out-bom" class="p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono space-y-2 text-amber-300"></div>
  </div>
  <script>
    const out = document.getElementById('out-bom');
    out.innerHTML = `
      <div>🖥️ Pantalla: ${screen.width}x${screen.height} px</div>
      <div>🌐 Estado Conexión (navigator.onLine): <strong>${navigator.onLine ? 'ONLINE ✅' : 'OFFLINE ❌'}</strong></div>
      <div>📍 Dirección actual (location.href): ${location.href}</div>
      <div>📜 Longitud del Historial (history.length): ${history.length}</div>
    `;
  </script>
</body>
</html>
