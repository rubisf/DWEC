<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Reto 1: Renderizado con DocumentFragment</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 font-sans">
  <div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-lg font-bold text-indigo-400">🎯 Reto 1: Inserción de 100 Nodos con DocumentFragment (1 solo Reflow)</h2>
    <ul id="lista-fragment" class="p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono max-h-48 overflow-y-auto space-y-1"></ul>
    <div id="out-time" class="text-xs font-mono text-emerald-400"></div>
  </div>
  <script>
    const ul = document.getElementById('lista-fragment');
    const fragment = document.createDocumentFragment();
    const t0 = performance.now();

    for (let i = 1; i <= 100; i++) {
      const li = document.createElement('li');
      li.className = 'text-slate-300';
      li.textContent = `Item #${i} insertado en DocumentFragment`;
      fragment.appendChild(li);
    }

    ul.appendChild(fragment); // 1 sola inserción DOM
    const t1 = performance.now();
    document.getElementById('out-time').textContent = `✅ 100 nodos insertados en un solo reflow en: ${(t1 - t0).toFixed(3)} ms`;
  </script>
</body>
</html>
