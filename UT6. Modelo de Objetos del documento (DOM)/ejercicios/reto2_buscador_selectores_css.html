<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Reto 2: Recorrido con closest('tr')</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 font-sans">
  <div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-lg font-bold text-emerald-400">🎯 Reto 2: Localizar Fila tr Ancestor con closest('tr')</h2>
    <table class="w-full text-xs font-mono border-collapse">
      <thead>
        <tr class="bg-slate-950 text-slate-400 text-left">
          <th class="p-2">ID</th><th class="p-2">Alumno</th><th class="p-2">Acción</th>
        </tr>
      </thead>
      <tbody id="tabla-body">
        <tr class="border-t border-slate-700">
          <td class="p-2">101</td><td class="p-2">Ana Gómez</td>
          <td class="p-2"><button onclick="eliminarFila(this)" class="bg-rose-600 hover:bg-rose-500 text-white px-2 py-1 rounded">Eliminar Fila</button></td>
        </tr>
      </tbody>
    </table>
    <div id="out-closest" class="text-xs font-mono text-amber-300"></div>
  </div>
  <script>
    function eliminarFila(btn) {
      const tr = btn.closest('tr');
      if (tr) {
        tr.classList.add('bg-rose-950', 'text-rose-300');
        document.getElementById('out-closest').textContent = `Fila <tr> localizada con closest('tr') y eliminada.`;
        setTimeout(() => tr.remove(), 400);
      }
    }
  </script>
</body>
</html>
