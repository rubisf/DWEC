<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Reto 3: Dataset y Modo Oscuro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 font-sans">
  <div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-lg font-bold text-amber-400">🎯 Reto 3: Alternar data-theme mediante dataset</h2>
    <button id="btn-theme" onclick="alternarTema()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-1.5 px-4 rounded text-xs">
      Modo Actual: dark
    </button>
    <div id="out-theme" class="p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono text-amber-300"></div>
  </div>
  <script>
    document.documentElement.dataset.theme = 'dark';
    function alternarTema() {
      const actual = document.documentElement.dataset.theme;
      const nuevo = actual === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = nuevo;
      document.getElementById('btn-theme').textContent = `Modo Actual: ${nuevo}`;
      document.getElementById('out-theme').textContent = `Atributo html.dataset.theme actualizado a '${nuevo}'.`;
    }
  </script>
</body>
</html>
