<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulador de API REST</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 font-mono text-xs">
  <div class="max-w-3xl mx-auto">
    <h1 class="text-xl font-bold text-teal-400 mb-1 font-sans">Simulador de Cliente y Endpoints RESTful</h1>
    <p class="text-slate-400 mb-6 font-sans text-xs">Prueba llamadas HTTP y analiza cabeceras y códigos de respuesta.</p>

    <div class="grid grid-cols-4 gap-2 mb-4">
      <button onclick="simularReq('GET', '/api/v1/usuarios', 200)" class="p-2 bg-blue-600 hover:bg-blue-500 rounded font-bold">GET (200 OK)</button>
      <button onclick="simularReq('POST', '/api/v1/usuarios', 201)" class="p-2 bg-emerald-600 hover:bg-emerald-500 rounded font-bold">POST (201 Created)</button>
      <button onclick="simularReq('PUT', '/api/v1/usuarios/99', 404)" class="p-2 bg-amber-600 hover:bg-amber-500 rounded font-bold">PUT (404 Not Found)</button>
      <button onclick="simularReq('DELETE', '/api/v1/usuarios/4', 204)" class="p-2 bg-rose-600 hover:bg-rose-500 rounded font-bold">DELETE (204 No Content)</button>
    </div>

    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
      <div class="flex justify-between text-slate-500 border-b border-slate-800 pb-1">
        <span>RESPUESTA HTTP</span>
        <span id="badgeStatus" class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-800 text-slate-300">LISTO</span>
      </div>
      <div id="endpointTxt" class="text-teal-300 font-bold"></div>
      <div id="bodyJson" class="text-slate-300 whitespace-pre"></div>
    </div>
  </div>

  <script>
    function simularReq(metodo, url, status) {
      document.getElementById('endpointTxt').textContent = `${metodo} ${url} HTTP/1.1`;
      const badge = document.getElementById('badgeStatus');
      badge.textContent = `${status}`;
      badge.className = status < 300 ? "px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-950 text-emerald-300 border border-emerald-700" : "px-2 py-0.5 rounded text-[10px] font-bold bg-rose-950 text-rose-300 border border-rose-700";

      let data = {};
      if (status === 200) data = [{ id: 1, nombre: "Lucía Santos", rol: "Admin" }, { id: 2, nombre: "Marcos Rey", rol: "Editor" }];
      else if (status === 201) data = { id: 3, nombre: "Nuevo Usuario", creadoEn: new Date().toISOString() };
      else if (status === 404) data = { error: "NotFoundError", mensaje: "El recurso solicitado no existe" };
      else if (status === 204) data = "// 204 No Content: Registro eliminado sin cuerpo devuelto";

      document.getElementById('bodyJson').textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
