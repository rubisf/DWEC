<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Reto 1: Contadores Privados con Closures</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 font-sans">
  <div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-lg font-bold text-indigo-400">🎯 Reto 1: Encapsulamiento con Closures (incrementar, decrementar, obtenerValor)</h2>
    <div id="out-closure" class="p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono space-y-2 text-indigo-300"></div>
  </div>
  <script>
    function crearContador(inicial = 0) {
      let valorPrivado = inicial; // Variable encapsulada en el ámbito léxico
      return {
        incrementar: () => ++valorPrivado,
        decrementar: () => --valorPrivado,
        obtenerValor: () => valorPrivado
      };
    }

    const miContador = crearContador(10);
    miContador.incrementar();
    miContador.incrementar();
    miContador.decrementar();

    const out = document.getElementById('out-closure');
    out.innerHTML = `
      <div>Valor actual del contador: <strong>${miContador.obtenerValor()}</strong></div>
      <div class="text-slate-400">miContador.valorPrivado === <code>${typeof miContador.valorPrivado}</code> (Estado verdaderamente privado ✅)</div>
    `;
  </script>
</body>
</html>
