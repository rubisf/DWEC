<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Reto 3: POO Clases y Campos Privados</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 font-sans">
  <div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-lg font-bold text-amber-400">🎯 Reto 3: Clases ES6, Campos Privados (#salario), extends y super</h2>
    <div id="out-poo" class="p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono space-y-2 text-amber-300"></div>
  </div>
  <script>
    class Empleado {
      #salario; // Campo privado nativo
      constructor(nombre, salarioBase) {
        this.nombre = nombre;
        this.#salario = salarioBase;
      }
      getSalarioBase() { return this.#salario; }
    }

    class Desarrollador extends Empleado {
      constructor(nombre, salarioBase, lenguajePrincipal) {
        super(nombre, salarioBase);
        this.lenguajePrincipal = lenguajePrincipal;
      }
      calcularNominaAnual(bono = 2000) {
        return (this.getSalarioBase() * 12) + bono;
      }
    }

    const dev = new Desarrollador("Marta", 2500, "JavaScript/TypeScript");
    const out = document.getElementById('out-poo');
    out.innerHTML = `
      <div>👩‍💻 Desarrolladora: <strong>${dev.nombre}</strong> (${dev.lenguajePrincipal})</div>
      <div>💵 Salario Base Mensual: €${dev.getSalarioBase()}</div>
      <div class="text-emerald-400 font-bold">💳 Nómina Anual con Bono: €${dev.calcularNominaAnual()}</div>
    `;
  </script>
</body>
</html>
