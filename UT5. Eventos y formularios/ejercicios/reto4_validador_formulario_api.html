<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Reto 4: setCustomValidity y FormData</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 font-sans">
  <div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-lg font-bold text-sky-400">🎯 Reto 4: Constraint Validation con setCustomValidity y FormData</h2>
    <form id="form-pass" class="space-y-2">
      <input id="pass-input" name="password" type="password" placeholder="Prueba contraseña..." required class="p-2 bg-slate-950 border border-slate-700 rounded text-xs text-white w-full">
      <button type="submit" class="bg-sky-600 text-white font-bold py-1.5 px-3 rounded text-xs">Validar y Procesar FormData</button>
    </form>
    <div id="out-formdata" class="p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono text-sky-300"></div>
  </div>
  <script>
    const form = document.getElementById('form-pass');
    const input = document.getElementById('pass-input');

    input.addEventListener('input', () => {
      const val = input.value;
      const tieneNumero = /\d/.test(val);
      if (val.length < 8 || !tieneNumero) {
        input.setCustomValidity("La contraseña debe tener al menos 8 caracteres y contener un número.");
      } else {
        input.setCustomValidity(""); // Vacío = Válido
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const out = document.getElementById('out-formdata');
      if (form.checkValidity()) {
        const data = new FormData(form);
        out.innerHTML = `
          <div class="text-emerald-400">✅ Formulario Válido. FormData extraído:</div>
          <div>password: "<strong>${data.get('password')}</strong>"</div>
        `;
      } else {
        out.innerHTML = `<div class="text-rose-400">❌ Error: ${input.validationMessage}</div>`;
      }
    });
  </script>
</body>
</html>
