<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Reto 2: Delegación de Eventos con closest()</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 font-sans">
  <div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-lg font-bold text-emerald-400">🎯 Reto 2: Delegación de Eventos con e.target.closest('li') en ul</h2>
    <ul id="lista-padre" class="space-y-2 text-xs font-mono cursor-pointer">
      <li data-id="1" class="p-3 bg-slate-950 border border-slate-700 rounded-xl text-emerald-300 flex justify-between items-center">
        <span>Item 1 (Haz clic para eliminar)</span> 🗑️
      </li>
      <li data-id="2" class="p-3 bg-slate-950 border border-slate-700 rounded-xl text-emerald-300 flex justify-between items-center">
        <span>Item 2 (Haz clic para eliminar)</span> 🗑️
      </li>
    </ul>
    <div id="out-deleg" class="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono text-amber-300"></div>
  </div>
  <script>
    // Único listener registrado en el contenedor padre <ul>
    document.getElementById('lista-padre').addEventListener('click', (e) => {
      const li = e.target.closest('li');
      if (li) {
        const id = li.dataset.id;
        li.remove();
        document.getElementById('out-deleg').textContent = `🗑️ Elemento con data-id="${id}" eliminado mediante único listener en <ul>.`;
      }
    });
  </script>
</body>
</html>
