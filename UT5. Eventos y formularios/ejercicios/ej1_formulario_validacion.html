<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Constraint Validation API</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6 text-slate-800">
  <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
    <h1 class="text-xl font-bold text-slate-900 mb-1">Validación con Constraint Validation API</h1>
    <p class="text-xs text-slate-500 mb-6">Uso de ValidityState, setCustomValidity() y FormData.</p>

    <form id="registroForm" novalidate class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre de Usuario (min 4 letras)</label>
        <input id="username" name="username" type="text" required minlength="4" class="w-full border p-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <span id="errUser" class="text-xs text-rose-600 font-semibold mt-1 block"></span>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Correo Electrónico</label>
        <input id="email" name="email" type="email" required class="w-full border p-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <span id="errEmail" class="text-xs text-rose-600 font-semibold mt-1 block"></span>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Contraseña (Mínimo 8 caracteres)</label>
        <input id="pass" name="pass" type="password" required minlength="8" class="w-full border p-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <span id="errPass" class="text-xs text-rose-600 font-semibold mt-1 block"></span>
      </div>

      <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg text-sm transition">
        Enviar con FormData
      </button>
    </form>

    <div id="resultadoEnvio" class="mt-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl text-xs font-mono hidden"></div>
  </div>

  <script>
    const form = document.getElementById('registroForm');
    const uInput = document.getElementById('username');
    const eInput = document.getElementById('email');

    uInput.addEventListener('input', () => {
      if (uInput.validity.tooShort) {
        uInput.setCustomValidity("El usuario debe tener al menos 4 caracteres.");
      } else {
        uInput.setCustomValidity("");
      }
      document.getElementById('errUser').textContent = uInput.validationMessage;
    });

    eInput.addEventListener('input', () => {
      if (eInput.validity.typeMismatch) {
        eInput.setCustomValidity("Por favor, introduce una dirección de correo válida.");
      } else {
        eInput.setCustomValidity("");
      }
      document.getElementById('errEmail').textContent = eInput.validationMessage;
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      // Extracción automática con FormData API
      const fd = new FormData(form);
      const data = Object.fromEntries(fd.entries());
      data.pass = "********"; // Sanitizado para vista

      const resBox = document.getElementById('resultadoEnvio');
      resBox.classList.remove('hidden');
      resBox.innerHTML = `✅ Formulario válido y procesado con FormData:<br><pre class="mt-1">${JSON.stringify(data, null, 2)}</pre>`;
    });
  </script>
</body>
</html>
