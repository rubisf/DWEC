<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Reto 3: Atajos de Teclado</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 font-sans">
  <div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-lg font-bold text-amber-400">🎯 Reto 3: Atajos de Teclado (Ctrl+Enter / Escape)</h2>
    <p class="text-xs text-slate-400">Presiona <code>Ctrl + Enter</code> para enviar mensaje o <code>Escape</code> para cerrar.</p>
    <div id="out-key" class="p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono text-amber-300"></div>
  </div>
  <script>
    document.addEventListener('keydown', (e) => {
      const out = document.getElementById('out-key');
      if (e.ctrlKey && e.key === 'Enter') {
        out.innerHTML = '<div class="text-emerald-400">🚀 Atajo detectado: Ctrl + Enter (Mensaje enviado)</div>';
      } else if (e.key === 'Escape') {
        out.innerHTML = '<div class="text-rose-400">❌ Atajo detectado: Escape (Modal cerrado)</div>';
      }
    });
  </script>
</body>
</html>
