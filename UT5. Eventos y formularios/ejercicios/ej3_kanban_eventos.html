<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delegación de Eventos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6 text-slate-800">
  <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
    <h1 class="text-xl font-bold text-slate-900 mb-1">Delegación de Eventos en Listas Dinámicas</h1>
    <p class="text-xs text-slate-500 mb-4">Un solo escuchador en el elemento padre 'ul' gestiona todas las tarjetas actuales y futuras.</p>

    <div class="flex gap-2 mb-4">
      <input id="itemTexto" type="text" placeholder="Nueva tarea..." class="border p-2 rounded-lg text-sm flex-1">
      <button onclick="agregarItem()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold">Añadir Tarea</button>
    </div>

    <ul id="listaTareas" class="space-y-2 text-sm">
      <li data-id="1" class="p-3 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center group">
        <span>Revisar especificaciones de la API</span>
        <div class="space-x-2">
          <button class="btn-check text-emerald-600 font-bold hover:underline">Completar</button>
          <button class="btn-delete text-rose-600 font-bold hover:underline">Eliminar</button>
        </div>
      </li>
    </ul>
  </div>

  <script>
    const lista = document.getElementById('listaTareas');

    // UN SOLO escuchador en la lista para delegar eventos
    lista.addEventListener('click', (e) => {
      const target = e.target;
      const li = target.closest('li');
      if (!li) return;

      if (target.classList.contains('btn-delete')) {
        li.remove();
      } else if (target.classList.contains('btn-check')) {
        li.classList.toggle('bg-emerald-50');
        li.querySelector('span').classList.toggle('line-through');
        li.querySelector('span').classList.toggle('text-slate-400');
      }
    });

    function agregarItem() {
      const input = document.getElementById('itemTexto');
      const val = input.value.trim();
      if (!val) return;

      const li = document.createElement('li');
      li.className = "p-3 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center group";
      li.innerHTML = `
        <span>${val}</span>
        <div class="space-x-2">
          <button class="btn-check text-emerald-600 font-bold hover:underline">Completar</button>
          <button class="btn-delete text-rose-600 font-bold hover:underline">Eliminar</button>
        </div>
      `;
      lista.append(li);
      input.value = "";
    }
  </script>
</body>
</html>
