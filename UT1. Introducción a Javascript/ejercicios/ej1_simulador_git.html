<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulador de Estados y Flujo Git</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; } code { font-family: 'Fira Code', monospace; }</style>
</head>
<body class="bg-slate-900 text-slate-100 p-6 min-h-screen">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold text-indigo-400 mb-2">Simulador Interactivo de Estados Git</h1>
    <p class="text-slate-400 text-sm mb-6">Experimenta con el flujo de trabajo: Working Directory ➔ Staging Area ➔ Repositorio Local.</p>

    <!-- Controles -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-6 flex flex-wrap gap-3 items-center">
      <input id="filenameInput" type="text" placeholder="nombre_archivo.js" class="bg-slate-950 border border-slate-600 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
      <button onclick="crearArchivo()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-semibold transition">1. Modificar (Working)</button>
      <button onclick="stageAll()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-sm font-semibold transition">2. git add . (Staging)</button>
      <button onclick="commitAll()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-semibold transition">3. git commit -m</button>
      <button onclick="resetAll()" class="px-4 py-2 bg-rose-700 hover:bg-rose-600 text-white rounded-lg text-sm font-semibold ml-auto">Reset</button>
    </div>

    <!-- Las 3 Áreas -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      
      <div class="bg-slate-800/80 rounded-xl p-4 border border-blue-500/40">
        <h2 class="text-xs font-bold uppercase tracking-wider text-blue-400 mb-2 flex items-center justify-between">
          <span>Working Tree</span>
          <span id="count-working" class="px-2 py-0.5 rounded bg-blue-900/50 text-blue-200">0</span>
        </h2>
        <div id="box-working" class="space-y-2 min-h-[140px] text-xs"></div>
      </div>

      <div class="bg-slate-800/80 rounded-xl p-4 border border-amber-500/40">
        <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400 mb-2 flex items-center justify-between">
          <span>Staging Area</span>
          <span id="count-staging" class="px-2 py-0.5 rounded bg-amber-900/50 text-amber-200">0</span>
        </h2>
        <div id="box-staging" class="space-y-2 min-h-[140px] text-xs"></div>
      </div>

      <div class="bg-slate-800/80 rounded-xl p-4 border border-emerald-500/40">
        <h2 class="text-xs font-bold uppercase tracking-wider text-emerald-400 mb-2 flex items-center justify-between">
          <span>Git Commits</span>
          <span id="count-commits" class="px-2 py-0.5 rounded bg-emerald-900/50 text-emerald-200">0</span>
        </h2>
        <div id="box-commits" class="space-y-2 min-h-[140px] text-xs"></div>
      </div>

    </div>

    <!-- Terminal Log -->
    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs text-slate-300 font-mono">
      <div class="text-slate-500 mb-1 border-b border-slate-800 pb-1">Terminal Output:</div>
      <div id="consoleLog" class="space-y-1 max-h-36 overflow-y-auto">
        <p class="text-slate-400">$ git status -s // Repositorio inicializado en rama 'main'</p>
      </div>
    </div>

  </div>

  <script>
    let workingFiles = ["main.js", "styles.css"];
    let stagingFiles = [];
    let commits = [];

    function render() {
      document.getElementById('count-working').textContent = workingFiles.length;
      document.getElementById('count-staging').textContent = stagingFiles.length;
      document.getElementById('count-commits').textContent = commits.length;

      document.getElementById('box-working').innerHTML = workingFiles.map(f => `
        <div class="p-2 bg-blue-950/60 border border-blue-800/50 rounded flex justify-between items-center text-blue-200">
          <span>📄 ${f}</span>
          <span class="text-[10px] text-blue-400">Untracked / Modified</span>
        </div>
      `).join('') || '<p class="text-slate-500 italic">Árbol de trabajo limpio</p>';

      document.getElementById('box-staging').innerHTML = stagingFiles.map(f => `
        <div class="p-2 bg-amber-950/60 border border-amber-800/50 rounded flex justify-between items-center text-amber-200">
          <span>➕ ${f}</span>
          <span class="text-[10px] text-amber-400">Index Ready</span>
        </div>
      `).join('') || '<p class="text-slate-500 italic">No hay cambios en staging</p>';

      document.getElementById('box-commits').innerHTML = commits.map(c => `
        <div class="p-2 bg-emerald-950/60 border border-emerald-800/50 rounded text-emerald-200">
          <div class="font-bold flex justify-between">
            <span>🔖 ${c.hash}</span>
            <span class="text-[10px] opacity-75">${c.files.length} archivos</span>
          </div>
          <div class="text-xs text-emerald-300">${c.msg}</div>
        </div>
      `).join('') || '<p class="text-slate-500 italic">Sin commits todavía</p>';
    }

    function log(txt, color="text-slate-300") {
      const c = document.getElementById('consoleLog');
      c.innerHTML += `<p class="${color}">$ ${txt}</p>`;
      c.scrollTop = c.scrollHeight;
    }

    function crearArchivo() {
      const input = document.getElementById('filenameInput');
      const val = input.value.trim() || `modulo_${Date.now().toString().slice(-4)}.js`;
      workingFiles.push(val);
      input.value = "";
      log(`echo "// código nuevo" > ${val}`, "text-blue-400");
      render();
    }

    function stageAll() {
      if (workingFiles.length === 0) return log("nothing to add", "text-amber-400");
      stagingFiles.push(...workingFiles);
      workingFiles = [];
      log(`git add . (${stagingFiles.length} archivos preparados para commit)`, "text-amber-400");
      render();
    }

    function commitAll() {
      if (stagingFiles.length === 0) return log("nothing to commit, working tree clean", "text-rose-400");
      const hash = Math.random().toString(16).substring(2, 9);
      commits.unshift({
        hash,
        msg: `feat: actualización de ${stagingFiles.join(', ')}`,
        files: [...stagingFiles]
      });
      stagingFiles = [];
      log(`git commit -m "feat: commit [${hash}]"`, "text-emerald-400");
      render();
    }

    function resetAll() {
      workingFiles = ["index.html"];
      stagingFiles = [];
      commits = [];
      log("git reset --hard HEAD (repositorio reseteado)", "text-rose-400");
      render();
    }

    render();
  </script>
</body>
</html>
