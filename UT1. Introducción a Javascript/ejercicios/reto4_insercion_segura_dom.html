<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Reto 4: Inserción Segura en el DOM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 font-sans">
  <div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
    <h2 class="text-lg font-bold text-sky-400">🎯 Reto 4: Inserción con createElement, append y classList</h2>
    <button onclick="agregarProducto('Portátil Gaming DAW', 'Intel i7, 32GB RAM, SSD 1TB')" class="bg-sky-600 hover:bg-sky-500 text-white font-bold py-1.5 px-3 rounded-lg text-xs">
      ➕ Agregar Producto al #catalogo (append)
    </button>
    <div id="catalogo" class="p-4 bg-slate-950 rounded-xl border border-slate-800 space-y-2 min-h-[100px]"></div>
  </div>
  <script>
    function agregarProducto(titulo, descripcion) {
      const contenedor = document.querySelector('#catalogo');
      const card = document.createElement('article');
      card.classList.add('p-3', 'bg-slate-900', 'border', 'border-sky-500/40', 'rounded-xl');

      const h3 = document.createElement('h3');
      h3.classList.add('font-bold', 'text-sky-400', 'text-xs');
      h3.textContent = titulo;

      const p = document.createElement('p');
      p.classList.add('text-slate-400', 'text-[11px]');
      p.textContent = descripcion;

      card.append(h3, p);
      contenedor.append(card);
    }
  </script>
</body>
</html>
